[project]
name = "flux-server"
version = "0.1.0"
description = "OpenAI-compatible image API for FLUX.2-klein-4B (text-to-image + image editing) with Gradio debug UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "diffusers>=0.40",
    "transformers>=5.16",
    "accelerate>=1.14",
    "safetensors>=0.8",
    "huggingface_hub>=1.0",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "python-multipart>=0.0.32",
    "pillow>=12",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "gradio>=6.26",
    "openai>=3.7",
]

[project.scripts]
flux-server = "flux_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
